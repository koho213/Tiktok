<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cutefish StreamShield - K.hocine Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        panelbg: '#111827',
                        terminalbg: '#030712',
                        accent: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col items-center justify-center p-4 font-mono">

    <div class="w-full max-w-xl bg-panelbg border border-gray-800 rounded-2xl shadow-2xl overflow-hidden backdrop-blur-md">
        <!-- Header de la fenêtre -->
        <div class="bg-gray-900/80 px-5 py-4 border-b border-gray-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-red-500 shadow-sm shadow-red-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500 shadow-sm shadow-yellow-500/50"></div>
                <div class="w-3 h-3 rounded-full bg-green-500 shadow-sm shadow-green-500/50"></div>
                <span class="text-xs font-semibold text-gray-400 ml-3 tracking-wider">StreamShield Studio | K.hocine</span>
            </div>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium">ONLINE</span>
        </div>

        <!-- Corps de l'application -->
        <div class="p-6 space-y-6">
            
            <!-- Zone de Glisser-Déposer (Dropzone) -->
            <div id="dropzone" class="border-2 border-dashed border-gray-700 hover:border-accent rounded-xl p-8 text-center cursor-pointer transition-all bg-gray-900/40 group">
                <input type="file" id="video-file" name="video" accept="video/mp4" class="hidden">
                <div class="space-y-3 pointer-events-none">
                    <div class="w-12 h-12 rounded-full bg-accent/10 text-accent flex items-center justify-center mx-auto group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                    </div>
                    <div>
                        <p class="text-sm font-medium text-gray-200">Glissez votre vidéo MP4 ici ou <span class="text-accent underline underline-offset-4">parcourez</span></p>
                        <p id="file-name" class="text-xs text-gray-500 mt-1">Format accepté : MP4 (Développé par K.hocine)</p>
                    </div>
                </div>
            </div>

            <!-- Bouton d'action -->
            <button id="submit-btn" class="w-full bg-accent hover:bg-emerald-600 text-gray-950 font-bold py-3.5 px-6 rounded-xl transition-all shadow-lg shadow-emerald-900/20 flex items-center justify-center space-x-2 hidden cursor-pointer">
                <svg class="w-5 h-5 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
                <span>Lancer le traitement StreamShield</span>
            </button>

            <!-- Écran Terminal de Logs (Caché au début) -->
            <div id="terminal-container" class="hidden space-y-3">
                <div class="flex justify-between items-center text-xs text-gray-400 px-1">
                    <span class="flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full bg-accent animate-ping"></span>
                        <span>Console K.hocine Engine</span>
                    </span>
                    <span id="progress-text" class="text-accent font-bold">Traitement...</span>
                </div>
                <div id="terminal-box" class="bg-terminalbg border border-gray-800 rounded-xl p-4 h-48 overflow-y-auto text-xs font-mono text-emerald-400 shadow-inner space-y-1">
                    <!-- Les logs s'affichent ici -->
                </div>
            </div>

        </div>
        
        <!-- Pied de page avec signature -->
        <div class="bg-gray-950 px-6 py-3 border-t border-gray-800/60 text-center">
            <p class="text-[11px] text-gray-500">Propulsé par StreamShield Engine &bull; Conçu par <span class="text-accent font-semibold">K.hocine</span></p>
        </div>
    </div>

    <!-- Script JavaScript Moderne -->
    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('video-file');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const terminalContainer = document.getElementById('terminal-container');
        const terminalBox = document.getElementById('terminal-box');
        const progressText = document.getElementById('progress-text');

        let selectedFile = null;

        dropzone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = `Sélectionné : ${selectedFile.name} (${(selectedFile.size / (1024*1024)).toFixed(2)} MB)`;
                fileName.classList.add('text-accent');
                submitBtn.classList.remove('hidden');
            }
        });

        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-accent'); });
        dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('border-accent'); });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-accent');
            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = `Sélectionné : ${selectedFile.name} (${(selectedFile.size / (1024*1024)).toFixed(2)} MB)`;
                fileName.classList.add('text-accent');
                submitBtn.classList.remove('hidden');
            }
        });

        async function addLog(text, colorClass = "text-emerald-400") {
            const div = document.createElement('div');
            div.className = colorClass;
            div.textContent = text;
            terminalBox.appendChild(div);
            terminalBox.scrollTop = terminalBox.scrollHeight;
            await new Promise(r => setTimeout(r, 120));
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            submitBtn.classList.add('hidden');
            dropzone.classList.add('pointer-events-none', 'opacity-50');
            terminalContainer.classList.remove('hidden');
            terminalBox.innerHTML = '';

            await addLog(`=== K.hocine Studio — Initializing ===`, "text-gray-400");
            await addLog(`  File : ${selectedFile.name} (${(selectedFile.size / (1024*1024)).toFixed(2)} MB)`, "text-gray-300");
            await addLog(`  method : FISH (K.hocine Edition)`, "text-gray-300");
            await addLog(`  Compress : OFF`, "text-gray-300");
            await addLog(`====================`, "text-gray-400");
            await addLog(`[StreamShield K.hocine] Initializing server-side stream multiplexing...`);
            await addLog(`[FFmpeg] Loading binary core & generating secondary audio stream...`);

            const formData = new FormData();
            formData.append('video', selectedFile);

            try {
                const response = await fetch('/process', { method: 'POST', body: formData });
                if (!response.ok) throw new Error('Erreur de traitement serveur');

                await addLog(`[Success] Metadata injection & multi-stream completed!`);
                await addLog(`[Download] Preparing file for download...`, "text-yellow-400");
                progressText.textContent = "Téléchargement...";

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = selectedFile.name.replace(/\.[^/.]+$/, "") + '_hd.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();

                progressText.textContent = "Terminé avec succès !";
                progressText.className = "text-emerald-400 font-bold";

                await addLog(`=> Process Completed Successfully! Output: ${a.download}`, "text-accent font-bold");

            } catch (err) {
                await addLog(`[Erreur critique] : ${err.message}`, "text-red-400");
                progressText.textContent = "Échec du traitement";
                progressText.className = "text-red-400 font-bold";
            }
        });
    </script>
</body>
</html>
